plugins { id 'java' }

repositories { mavenCentral() }

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation 'io.appium:java-client:10.1.1'
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.44.0'
    testImplementation 'org.testng:testng:7.11.0'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

test {
    useTestNG { configFailurePolicy = 'continue' }
    if (System.getProperty('mobile.target', 'emulator') == 'emulator') {
        exclude '**/RealDeviceTest.class'
    }
    maxParallelForks = 1
    systemProperties System.getProperties().findAll { key, value ->
        key.toString().startsWith('mobile.')
    }
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
    outputs.upToDateWhen { false }
}
